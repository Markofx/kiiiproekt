<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <form class="form-signin" method="post" action="/register">
                <h2 class="auth-title">Create Account</h2>
                
                <div th:if="${hasError}" class="error-message" th:text="${error}"></div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="repeatedPassword">Confirm Password</label>
                    <input type="password" id="repeatedPassword" name="repeatedPassword" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" name="surname" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Role</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" name="role" type="radio" id="ROLE_USER" value="ROLE_USER" checked>
                            <label class="form-check-label" for="ROLE_USER">User</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" name="role" type="radio" id="ROLE_ADMIN" value="ROLE_ADMIN">
                            <label class="form-check-label" for="ROLE_ADMIN">Admin</label>
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary" type="submit">Create Account</button>
            </form>
            <a href="/login" class="auth-link">Already have an account? Login here</a>
        </div>
    </div>
</body>
</html>
